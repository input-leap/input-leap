<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!-- Monitor body -->
  <rect x="2" y="3" width="18" height="12" rx="1" ry="1"
        fill="none" stroke="currentColor" stroke-width="1.4"/>
  <!-- Monitor stand neck -->
  <line x1="11" y1="15" x2="11" y2="18"
        stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Monitor stand base -->
  <line x1="7" y1="18" x2="15" y2="18"
        stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Right arrow (top) -->
  <line x1="6" y1="8" x2="14" y2="8"
        stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  <polyline points="11.5,5.5 14,8 11.5,10.5"
            fill="none" stroke="currentColor" stroke-width="1.3"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left arrow (bottom) -->
  <line x1="16" y1="11" x2="8" y2="11"
        stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  <polyline points="10.5,8.5 8,11 10.5,13.5"
            fill="none" stroke="currentColor" stroke-width="1.3"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
